# Preset announcements.
#
# Each entry under "announcements:" is keyed by a unique ID (letters, numbers,
# dashes). Fire one manually with:
#     /craftedannouncements trigger <id> [args...]
# ...or let it fire automatically on a schedule (see "interval" below).
#
# FIELDS
#   message   Required. Either a single line, or a YAML list of lines (each list
#             entry becomes one broadcast line). Supports legacy colour codes
#             (&a, &#RRGGBB) and MiniMessage (<green>, <gradient>) - mix freely.
#
#   interval  Optional. How often the preset fires automatically, using the units
#             d (days), h (hours), m (minutes), s (seconds) in any combination:
#             "2h30m", "45m", "1d", "90s", "1d2h30m15s". The first fire happens one
#             interval after the plugin loads/reloads.
#             NOTE: a preset that uses {0}/{1} arguments CANNOT be scheduled (there
#             is nothing to fill the arguments with). If you give such a preset an
#             interval it is ignored, with a console warning. A preset that is part
#             of a loop has its interval ignored.
#
#   sound     Optional. A sound played to every recipient whenever the preset fires
#             (manual trigger AND schedule). Remove the block for a silent preset.
#               name   A vanilla sound key ("entity.villager.no") or the enum form
#                      ("ENTITY_VILLAGER_NO"). Custom resource-pack keys work too.
#               volume Default 1.0.
#               pitch  Default 1.0.
#
# ARGUMENTS
#   Put {0}, {1}, {2}... anywhere in the message. When you trigger the preset you
#   supply exactly that many arguments, space-separated. Wrap an argument that
#   contains spaces in "double quotes":
#       /craftedannouncements trigger thanks Steve "VIP Rank"
#   -> {0} = Steve, {1} = VIP Rank
#
# LOOPS
#   A loop cycles through a list of the presets above, sending ONE of them every
#   interval, in order, then starting again from the top. Use loops instead of
#   giving every preset its own interval, so announcements never overlap.
#
#   loops:
#     <loop-id>:
#       interval       Required. How long between each message, same format as a
#                      preset interval ("30m", "1h", "1h30m"). The first message is
#                      sent one interval after the plugin loads/reloads.
#       announcements  Required. An ordered list of preset IDs from above. The same
#                      ID may appear more than once. Each send plays that preset's
#                      message and sound, exactly like a manual trigger.
#
#   NOTES
#     - A preset that is in a loop has its own "interval" ignored (a console
#       warning says so) - the loop decides when it is sent. It can still be
#       triggered manually.
#     - Presets that use {0}/{1} arguments cannot be in a loop (nothing would fill
#       the arguments); they are skipped with a console warning.
#     - Unknown preset IDs are skipped with a console warning. A loop with no usable
#       presets, or a missing/invalid interval, is not loaded.
#     - If nobody is online when a loop is due, nothing is sent and the loop does
#       not move on; it tries again one interval later.
#     - Each loop remembers its position (and whether it is paused) across reloads
#       and restarts, in loop-state.yml. Changing a loop's list of presets makes it
#       start again from its first message.
#     - Control loops in-game with /craftedannouncements loop <next|pause|resume|info> <loop>.

# Schema version - leave this alone; it drives the auto-merge on update.
config-version: 1

announcements:

  # Multi-line, no arguments - sent by the "tips" loop below.
  discord:
    message:
      - "<gold><bold>=== Community ===</bold>"
      - "<aqua>Join our Discord: <underlined>discord.gg/yourserver"
      - "<gray>See you there!"

  # Single line, no arguments - sent by the "tips" loop below.
  vote:
    message: "<green>Remember to vote for the server at <yellow>/vote<green> to earn rewards!"

  # Manual, two arguments, with a sound - e.g. fired by your store (Tebex) on a
  # purchase:  craftedannouncements trigger thanks %player% "%package%"
  thanks:
    message: "<green>Thank you <yellow>{0}</yellow> for purchasing <gold>{1}</gold>!"
    sound:
      name: entity.villager.no
      volume: 1.0
      pitch: 1.0

loops:

  # Sends "discord", then 30 minutes later "vote", then 30 minutes later
  # "discord" again, and so on - one message every 30 minutes, never two at once.
  tips:
    interval: 30m
    announcements:
      - discord
      - vote
